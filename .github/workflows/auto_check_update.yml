name: Auto Check & Update IPTV Streams

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/auto_check_update.yml'

concurrency:
  group: iptv-auto-check
  cancel-in-progress: true

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Health Check & Auto Failover
        run: |
          python scripts/check_and_update_streams.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.m3u HEALTH_REPORT.md
          if git diff --staged --quiet; then
            echo "No changes detected. Playlist is healthy and up-to-date."
          else
            git commit -m "chore(stream-bot): auto health check & failover update [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
